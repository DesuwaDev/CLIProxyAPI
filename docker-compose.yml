services:
  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:-ghcr.io/desuwadev/cliproxyapi:v2026.9.1}
    container_name: cli-proxy-api
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${CLI_PROXY_BIND:-0.0.0.0}:8317:8317"
      # OAuth callback ports are published by default.
      - "${CLI_PROXY_OAUTH_BIND:-0.0.0.0}:1455:1455"   # Codex
      - "${CLI_PROXY_OAUTH_BIND:-0.0.0.0}:8085:8085"   # Gemini
      - "${CLI_PROXY_OAUTH_BIND:-0.0.0.0}:54545:54545" # Claude
      - "${CLI_PROXY_OAUTH_BIND:-0.0.0.0}:51121:51121" # Antigravity
      - "${CLI_PROXY_OAUTH_BIND:-0.0.0.0}:11451:11451" # iFlow
    volumes:
      - ${CLI_PROXY_CONFIG_PATH:-./config.yaml}:/CLIProxyAPI/config.yaml
      - ${CLI_PROXY_AUTH_PATH:-./auths}:/root/.cli-proxy-api
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
      - ${CLI_PROXY_DATA_PATH:-./data}:/CLIProxyAPI/data
      - ${CLI_PROXY_PLUGIN_PATH:-./plugins}:/CLIProxyAPI/plugins
