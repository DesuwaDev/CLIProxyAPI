services:
  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:-ghcr.io/desuwadev/cliproxyapi:v2026.9.1}
    container_name: cli-proxy-api
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${CLI_PROXY_BIND:-0.0.0.0}:8317:8317"
      # Optional OAuth callback ports; enable only the provider you use.
      # - "127.0.0.1:1455:1455"   # Codex
      # - "127.0.0.1:8085:8085"   # Gemini
      # - "127.0.0.1:54545:54545" # Claude
      # - "127.0.0.1:51121:51121" # Antigravity
      # - "127.0.0.1:11451:11451" # iFlow
    volumes:
      - ${CLI_PROXY_CONFIG_PATH:-./config.yaml}:/CLIProxyAPI/config.yaml
      - ${CLI_PROXY_AUTH_PATH:-./auths}:/root/.cli-proxy-api
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
      - ${CLI_PROXY_DATA_PATH:-./data}:/CLIProxyAPI/data
      - ${CLI_PROXY_PLUGIN_PATH:-./plugins}:/CLIProxyAPI/plugins
