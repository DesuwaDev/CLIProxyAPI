name: Publish Docker

on:
  push:
    tags:
      - 'v20*'

permissions:
  contents: read

concurrency:
  group: docker-release
  cancel-in-progress: false

jobs:
  build:
    name: Native ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            machine: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Validate release and native architecture
        id: release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v20[0-9]{2}\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF_NAME" = "v$(tr -d '\r\n' < VERSION)"
          test "$(uname -m)" = '${{ matrix.machine }}'
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build our backend and embedded management UI
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: cpa-release:${{ matrix.arch }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ steps.release.outputs.commit }}
            BUILD_DATE=${{ steps.release.outputs.date }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=registry,ref=${{ steps.release.outputs.image }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ steps.release.outputs.image }}:buildcache-${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true
      - name: Check image startup and native modules
        env:
          IMAGE: cpa-release:${{ matrix.arch }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: bash .github/scripts/smoke-docker.sh
      - name: Push checked architecture image
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker tag "cpa-release:$ARCH" "$IMAGE:$GITHUB_REF_NAME-$ARCH"
          docker push "$IMAGE:$GITHUB_REF_NAME-$ARCH"

  publish:
    name: Publish multi-architecture release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish version and latest manifests
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create \
            --tag "$image:$GITHUB_REF_NAME" --tag "$image:latest" \
            "$image:$GITHUB_REF_NAME-amd64" "$image:$GITHUB_REF_NAME-arm64"
          docker buildx imagetools inspect "$image:$GITHUB_REF_NAME"
      - name: Create release with deployment files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'Native amd64 / arm64 image: `%s:%s`\n\nIncludes this fork’s embedded management UI and native modules.\n\n[Docker Compose deployment](https://github.com/%s/blob/%s/README_CN.md)\n' \
            "$image" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > release-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md --latest
          fi
          gh release upload "$GITHUB_REF_NAME" docker-compose.yml config.docker.example.yaml --clobber
